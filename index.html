<script>
var RD={"2026-05-04":"report_2026-05-04.html","2026-05-04-test":"report_2026-05-04-test.html","2026-05-03":"report_2026-05-03.html"};
var CY=new Date().getFullYear(),CM=new Date().getMonth()+1;
var TODAY='2026-05-06';
// 検索インデックス
var SI=null;
function escH(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function loadSI(cb){
  if(SI){cb();return;}
  fetch('search-index.json').then(function(r){return r.json();}).then(function(d){SI=d;cb();}).catch(function(){SI=[];cb();});
}
function doSearch(q){
  q=q.trim();
  var el=document.getElementById('search-results');
  if(!q){el.innerHTML='';return;}
  loadSI(function(){
    var r=(SI||[]).filter(function(i){
      return i.name.toLowerCase().includes(q.toLowerCase())||(i.code||'').toLowerCase().includes(q.toLowerCase());
    }).slice(0,20);
    var html=r.map(function(i){
      return '<div class="sr-item">'
        +'<div class="sr-name"><a href="'+i.report+'" style="color:#f1f5f9;text-decoration:none">'+escH(i.name)+'</a></div>'
        +'<div class="sr-meta"><span class="sr-type '+i.type+'">'+escH(i.type)+'</span>'
          +(i.sector?'<span class="sr-sector">'+escH(i.sector)+'</span>':'')+'</div>'
        +'<div class="sr-apps">'+i.dates.slice(0,5).map(function(d){
            return '<a class="sr-app" href="report_'+d+'.html">'+d+'</a>';
          }).join('')+'</div>'
        +'</div>';
    }).join('');
    el.innerHTML=html||'<p style="color:#334155;font-size:13px;margin-top:8px">一致する銘柄・テーマが見つかりません</p>';
  });
}
function clearSearch(){document.getElementById('search-input').value='';document.getElementById('search-results').innerHTML='';}
// ウォッチリスト表示
function renderWatchlist(){
  var list;try{list=JSON.parse(localStorage.getItem('watchlist')||'[]');}catch(_){list=[];}
  var el=document.getElementById('watch-chips');
  if(!el)return;
  if(!list.length){el.innerHTML='<span class="no-watch">まだ登録がありません（レポートの☆ボタンで追加）</span>';return;}
  loadSI(function(){
    var html=list.map(function(name){
      var found=(SI||[]).find(function(i){return i.name===name;});
      var href=found?found.report:'#';
      return '<a class="watch-chip" href="'+href+'">⭐ '+escH(name)+'</a>';
    }).join('');
    el.innerHTML=html||'<span class="no-watch">まだ登録がありません</span>';
  });
}
renderWatchlist();
function buildCal(y,m){
  document.getElementById('cal-title').textContent=y+'年'+m+'月';
  var first=new Date(y,m-1,1).getDay();
  var days=new Date(y,m,0).getDate();
  var html='';
  for(var i=0;i<first;i++) html+='<div class="cal-day"></div>';
  for(var d=1;d<=days;d++){
    var ds=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var isToday=ds===TODAY;
    var cls='cal-day'+(isToday?' today':'')+(RD[ds]?' has-report':'');
    html+='<div class="'+cls+'">'+(RD[ds]?'<a href="'+RD[ds]+'">'+d+'</a>':d)+'</div>';
  }
  document.getElementById('cal-cells').innerHTML=html;
}
function calPrev(){if(CM===1){CY--;CM=12;}else CM--;buildCal(CY,CM);}
function calNext(){if(CM===12){CY++;CM=1;}else CM++;buildCal(CY,CM);}
buildCal(CY,CM);
</script>
