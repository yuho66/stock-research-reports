.cal-day.has-report a{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#22d3ee;font-weight:700;text-decoration:none;border-radius:8px;background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.2);transition:all .18s;position:relative}
.cal-day.has-report a::after{content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:#22d3ee}
.cal-day.has-report a:hover{background:rgba(34,211,238,.2);border-color:#22d3ee;transform:scale(1.08);box-shadow:0 4px 16px rgba(34,211,238,.2)}
.cal-day.has-report.today a{background:rgba(129,140,248,.15);color:#818cf8;border-color:rgba(129,140,248,.35)}

<script>
var RD={"2026-05-04":"report_2026-05-04.html","2026-05-04-test":"report_2026-05-04-test.html","2026-05-03":"report_2026-05-03.html"};
var CY=new Date().getFullYear(),CM=new Date().getMonth()+1;
var TODAY='2026-05-06';
function buildCal(y,m){
  document.getElementById('cal-title').textContent=y+'年'+m+'月';
  var first=new Date(y,m-1,1).getDay();
  var days=new Date(y,m,0).getDate();
  var html='';
  for(var i=0;i<first;i++) html+='<div class="cal-day"></div>';
  for(var d=1;d<=days;d++){
    var ds=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var isToday=ds===TODAY;
    var cls='cal-day'+(isToday?' today':'')+(RD[ds]?' has-report':'');
    html+='<div class="'+cls+'">'+(RD[ds]?'<a href="'+RD[ds]+'">'+d+'</a>':d)+'</div>';
  }
  document.getElementById('cal-cells').innerHTML=html;
}
function calPrev(){if(CM===1){CY--;CM=12;}else CM--;buildCal(CY,CM);}
function calNext(){if(CM===12){CY++;CM=1;}else CM++;buildCal(CY,CM);}
buildCal(CY,CM);
</script>
