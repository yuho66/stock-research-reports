<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>投資シグナルレポート 2026-05-03</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Hiragino Sans','Yu Gothic','Meiryo',sans-serif;
       background:#0d1b2a; color:#cdd6f4; line-height:1.6; }
.header { background:linear-gradient(135deg,#1e3a5f,#0d1b2a);
          padding:32px 20px; text-align:center; border-bottom:2px solid #2a4a7f; }
.header h1 { font-size:26px; color:#89b4fa; letter-spacing:2px; }
.header .sub { color:#6c7086; margin-top:6px; font-size:14px; }
.stats { display:flex; justify-content:center; gap:20px; padding:20px; flex-wrap:wrap; }
.stat { background:#1e2d40; padding:16px 28px; border-radius:10px; text-align:center; min-width:110px; cursor:pointer; transition:background .2s; }
.stat:hover { background:#243447; }
.stat-n { font-size:32px; font-weight:bold; color:#89b4fa; }
.stat-l { font-size:12px; color:#6c7086; margin-top:4px; }
/* メインタブ */
.main-tabs { display:flex; gap:6px; padding:0 20px 0; max-width:1100px; margin:0 auto; }
.main-tab { padding:12px 28px; border-radius:10px 10px 0 0; border:none; cursor:pointer;
            font-size:15px; font-weight:bold; background:#1e2d40; color:#6c7086;
            transition:all .2s; }
.main-tab.active { background:#243447; color:#89b4fa; border-bottom:3px solid #89b4fa; }
.main-tab:hover:not(.active) { background:#1a2a3a; color:#cdd6f4; }
.tab-panel { display:none; }
.tab-panel.active { display:block; }
.container { max-width:1100px; margin:0 auto; padding:16px 20px 40px; }
.card { background:#1e2d40; border-radius:12px; margin-bottom:18px;
        overflow:hidden; box-shadow:0 4px 20px rgba(0,0,0,0.4); }
.card-head { padding:18px 20px; background:#162535;
             display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
.name { font-size:20px; font-weight:bold; flex:1; min-width:200px; }
.code { background:#243447; padding:2px 9px; border-radius:4px; font-size:13px; color:#89dceb; }
.badge { padding:3px 11px; border-radius:12px; font-size:12px; font-weight:bold; }
.badge-jp   { background:#1a3d5c; color:#74c7ec; }
.badge-us   { background:#3d1a1a; color:#f38ba8; }
.badge-both { background:#1a3d2a; color:#a6e3a1; }
.verdict { padding:5px 16px; border-radius:20px; font-weight:bold; color:#fff; font-size:14px; white-space:nowrap; }
.conf { font-size:12px; color:#6c7086; }
.body { padding:20px; }
.lbl { font-size:11px; color:#89b4fa; font-weight:bold;
       text-transform:uppercase; letter-spacing:1px; margin:18px 0 7px; }
.lbl:first-child { margin-top:0; }
p { font-size:14px; color:#bac2de; }
ul { padding-left:20px; font-size:14px; color:#f38ba8; }
li { margin-bottom:4px; }
.sources { display:flex; flex-wrap:wrap; gap:7px; }
.src { color:#74c7ec; padding:3px 10px; border-radius:12px; font-size:12px;
       background:#1a3d5c; text-decoration:none; transition:background .15s; }
.src:hover { background:#2a5a8c; }
.conclusion { background:#162535; border-radius:8px; padding:16px;
              font-size:14px; color:#cdd6f4; border-left:3px solid #89b4fa; }
.stocks-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:8px; margin-top:4px; }
.stock-chip { background:#243447; padding:6px 12px; border-radius:6px; font-size:13px; color:#a6e3a1; }
.no-data { color:#45475a; padding:20px; text-align:center; }
/* チャートタブ */
.chart-section { margin-top:18px; }
.chart-tabs { display:flex; gap:6px; margin-bottom:8px; }
.ctab { padding:5px 16px; border:1px solid #2a4a7f; border-radius:6px;
        background:transparent; color:#6c7086; cursor:pointer; font-size:13px; transition:all .15s; }
.ctab.active { background:#1a3d5c; color:#89b4fa; border-color:#89b4fa; }
.ctab:hover:not(.active) { background:#1a2a3a; color:#cdd6f4; }
.chart-wrap { border-radius:8px; overflow:hidden; background:#0d1b2a; min-height:360px; }
.chart-wrap iframe { display:block; width:100%; height:360px; border:none; }
</style>
</head>
<body>
<div class="header">
  <h1>📊 投資シグナルレポート</h1>
  <div class="sub">2026-05-03 ｜ YouTube深層分析 × ディープリサーチ統合</div>
</div>
<div class="stats">
  <div class="stat" onclick="switchTab('themes')"><div class="stat-n">0</div><div class="stat-l">🌏 注目テーマ</div></div>
  <div class="stat" onclick="switchTab('jp')"><div class="stat-n">0</div><div class="stat-l">🇯🇵 日本株候補</div></div>
  <div class="stat" onclick="switchTab('us')"><div class="stat-n">0</div><div class="stat-l">🇺🇸 米国株候補</div></div>
</div>
<div class="main-tabs">
  <button class="main-tab active" data-tab="themes" onclick="switchTab('themes')">🌏 テーマ（0）</button>
  <button class="main-tab" data-tab="jp" onclick="switchTab('jp')">🇯🇵 日本株（0）</button>
  <button class="main-tab" data-tab="us" onclick="switchTab('us')">🇺🇸 米国株（0）</button>
</div>
<div class="container">
  <div id="tab-themes" class="tab-panel active"><p class="no-data">本日の候補なし</p></div>
  <div id="tab-jp"     class="tab-panel"><p class="no-data">本日の候補なし</p></div>
  <div id="tab-us"     class="tab-panel"><p class="no-data">本日の候補なし</p></div>
</div>
<script>
function switchTab(id) {
  document.querySelectorAll('.main-tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  document.querySelector('[data-tab="' + id + '"]').classList.add('active');
}
function switchChart(iframeId, base, interval, btn) {
  document.getElementById(iframeId).src = base + interval;
  btn.closest('.chart-tabs').querySelectorAll('.ctab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}
</script>
</body>
</html>
