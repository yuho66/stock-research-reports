.stat{background:#0c1220;border:1px solid #1c2a40;padding:14px 22px;border-radius:12px;text-align:center;min-width:100px;cursor:pointer;transition:all .25s;position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(129,140,248,.06),rgba(34,211,238,.04));opacity:0;transition:opacity .25s}
.stat::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#6366f1,#22d3ee);transform:scaleX(0);transition:transform .3s;transform-origin:left}
.stat:hover{border-color:#2d3f5c;transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.stat:hover::before{opacity:1}
.stat:hover::after{transform:scaleX(1)}
.stat-n{font-size:30px;font-weight:800;background:linear-gradient(135deg,#818cf8,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

/* Tab nav */
.tab-nav{position:sticky;top:0;z-index:100;background:rgba(3,7,18,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid #1c2a40}

.tab-panel{display:none}
.tab-panel.active{display:block}
/* Container */
.container{max-width:1200px;margin:0 auto;padding:28px 20px 80px}
/* Cards */
.card{background:#0c1220;border:1px solid #1c2a40;border-radius:16px;margin-bottom:14px;overflow:hidden;transition:border-color .25s,box-shadow .25s,transform .2s}

.card-head{padding:18px 20px;background:rgba(12,18,32,.7);display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.name{font-size:18px;font-weight:700;flex:1;min-width:180px;color:#f1f5f9}

.badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.3px}
.badge-jp{background:rgba(34,211,238,.08);color:#22d3ee;border:1px solid rgba(34,211,238,.18)}
.badge-us{background:rgba(251,113,133,.08);color:#fb7185;border:1px solid rgba(251,113,133,.18)}
.badge-both{background:rgba(52,211,153,.08);color:#34d399;border:1px solid rgba(52,211,153,.18)}

.conf{font-size:11px;color:#475569;letter-spacing:.2px}
.body{padding:22px}
/* Labels */
.lbl{font-size:10px;font-weight:700;color:#818cf8;text-transform:uppercase;letter-spacing:1.8px;margin:22px 0 8px;display:flex;align-items:center;gap:6px}
.lbl:first-child{margin-top:0}
.lbl-hint{font-size:10px;color:#334155;font-weight:400;text-transform:none;letter-spacing:0}
p{font-size:14px;color:#94a3b8;line-height:1.75}
ul{padding-left:20px;font-size:14px;color:#94a3b8}
li{margin-bottom:5px}
.driver-list li{color:#34d399}
/* Conclusion */
.conclusion{background:linear-gradient(135deg,rgba(99,102,241,.07),rgba(34,211,238,.04));border-radius:12px;padding:18px;font-size:14px;color:#e2e8f0;border-left:3px solid #6366f1;line-height:1.75}
/* Financial Grid */
.fin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:14px 0;background:rgba(12,18,32,.8);border-radius:12px;padding:14px;border:1px solid #1c2a40}

.cap-badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;background:rgba(192,132,252,.08);color:#c084fc;border:1px solid rgba(192,132,252,.18)}
.sector-badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;background:rgba(251,191,36,.08);color:#fbbf24;border:1px solid rgba(251,191,36,.18)}
/* Section heads */
.section-head{font-size:13px;font-weight:700;margin:28px 0 14px;padding:10px 16px;border-radius:10px;display:flex;align-items:center;gap:8px;letter-spacing:.3px}
.section-head.large{background:rgba(99,102,241,.08);color:#818cf8;border:1px solid rgba(99,102,241,.15)}
.section-head.small{background:rgba(52,211,153,.08);color:#34d399;border:1px solid rgba(52,211,153,.15)}
/* Sources */
.sources{display:flex;flex-wrap:wrap;gap:6px}
.src{color:#22d3ee;padding:3px 10px;border-radius:20px;font-size:11px;background:rgba(34,211,238,.07);text-decoration:none;border:1px solid rgba(34,211,238,.15);transition:all .15s}
.src:hover{background:rgba(34,211,238,.15);border-color:#22d3ee}
.stocks-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.stock-chip{background:rgba(52,211,153,.07);padding:7px 12px;border-radius:8px;font-size:13px;color:#34d399;border:1px solid rgba(52,211,153,.15)}
.no-data{color:#334155;padding:48px;text-align:center;font-size:14px}
/* Charts */
.chart-section{margin-top:18px}
.chart-tabs{display:flex;gap:6px;margin-bottom:10px}
.ctab{padding:5px 14px;border:1px solid #1c2a40;border-radius:6px;background:transparent;color:#475569;cursor:pointer;font-size:12px;transition:all .15s}
.ctab.active{background:rgba(129,140,248,.12);color:#818cf8;border-color:rgba(129,140,248,.3)}
.ctab:hover:not(.active){border-color:#475569;color:#94a3b8}
.chart-wrap{border-radius:10px;overflow:hidden;background:#080d18;width:100%;height:400px}
.chart-links{display:flex;gap:10px;flex-wrap:wrap}
.chart-btn{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border-radius:9px;background:rgba(34,211,238,.08);color:#22d3ee;text-decoration:none;font-size:13px;font-weight:600;transition:all .18s;border:1px solid rgba(34,211,238,.2)}
.chart-btn:hover{background:rgba(34,211,238,.16);border-color:#22d3ee;transform:translateY(-1px)}
/* Back to top */
.back-to-top{position:fixed;bottom:28px;right:24px;width:40px;height:40px;background:rgba(99,102,241,.15);color:#818cf8;border:1px solid rgba(99,102,241,.3);border-radius:50%;font-size:16px;cursor:pointer;display:none;align-items:center;justify-content:center;transition:all .2s;backdrop-filter:blur(8px);z-index:200}
.back-to-top:hover{background:rgba(99,102,241,.28);transform:translateY(-2px)}
.mention-badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;background:rgba(251,191,36,.1);color:#fbbf24;border:1px solid rgba(251,191,36,.25)}
.history-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.history-chip{font-size:11px;padding:2px 8px;border-radius:10px;background:rgba(129,140,248,.08);color:#818cf8;border:1px solid rgba(129,140,248,.15)}
.history-chip.streak{background:rgba(52,211,153,.08);color:#34d399;border-color:rgba(52,211,153,.2)}
/* Mobile */
/* Filter bar */
.filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid #1c2a40}
.filter-btn{padding:5px 14px;border-radius:20px;border:1px solid #1c2a40;background:transparent;color:#475569;cursor:pointer;font-size:12px;font-weight:600;transition:all .15s;white-space:nowrap}
.filter-btn.active{background:rgba(129,140,248,.12);color:#818cf8;border-color:rgba(129,140,248,.3)}
.filter-btn:hover:not(.active){border-color:#2d3f5c;color:#94a3b8}
.card.hidden{display:none!important}
/* Watchlist */
.watch-btn{background:none;border:none;cursor:pointer;font-size:17px;color:#334155;padding:0 3px;transition:color .15s;line-height:1;flex-shrink:0}
.watch-btn.watching{color:#fbbf24}
.watch-btn:hover{color:#fbbf24}

<body>
<div class="header">
  <div class="back-link"><a href="https://yuho66.github.io/stock-research-reports/">← レポート一覧</a></div>

  <div class="sub">2026-05-03 ｜ YouTube深層分析 × ディープリサーチ統合</div>
</div>
<div class="stats">
  <div class="stat" onclick="switchTab('themes')"><div class="stat-n">0</div><div class="stat-l">🌏 注目テーマ</div></div>
  <div class="stat" onclick="switchTab('jp')"><div class="stat-n">0</div><div class="stat-l">🇯🇵 日本株候補</div></div>
  <div class="stat" onclick="switchTab('us')"><div class="stat-n">0</div><div class="stat-l">🇺🇸 米国株候補</div></div>
</div>
<div class="tab-nav">
  <div class="tab-nav-inner">
    <button class="main-tab active" data-tab="themes" onclick="switchTab('themes')">🌏 テーマ（0）</button>
    <button class="main-tab" data-tab="jp" onclick="switchTab('jp')">🇯🇵 日本株（0）</button>
    <button class="main-tab" data-tab="us" onclick="switchTab('us')">🇺🇸 米国株（0）</button>
  </div>
</div>
<div class="container">
  <div id="tab-themes" class="tab-panel active"><p class="no-data">本日の候補なし</p></div>
  <div id="tab-jp"     class="tab-panel"><p class="no-data">本日の候補なし</p></div>
  <div id="tab-us"     class="tab-panel"><p class="no-data">本日の候補なし</p></div>
</div>
<button class="back-to-top" id="btt" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="トップへ戻る">↑</button>
<script>
function tvCreate(id, sym, interval) {
  var el = document.getElementById(id);
  if (!el || !sym || typeof TradingView === 'undefined') return;
  el.innerHTML = '';
  new TradingView.widget({
    container_id: id,
    symbol: sym,
    interval: interval || 'M',
    theme: 'dark',
    locale: 'ja',
    autosize: true,
    hide_side_toolbar: true,
    allow_symbol_change: false,
    save_image: false,
    withdateranges: true,
  });
}
function tvInterval(id, sym, interval, btn) {
  tvCreate(id, sym, interval);
  btn.closest('.chart-tabs').querySelectorAll('.ctab').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
}
function initPanelCharts(panel) {
  if (typeof TradingView === 'undefined') return;
  panel.querySelectorAll('.chart-wrap[data-sym]').forEach(function(el) {
    // data-initialized 属性で二重初期化を防ぐ
    if (!el.dataset.initialized && el.dataset.sym) {
      el.dataset.initialized = '1';
      tvCreate(el.id, el.dataset.sym, el.dataset.interval || 'M');
    }
  });
}
function switchTab(id) {
  document.querySelectorAll('.main-tab').forEach(function(b){ b.classList.remove('active'); });
  document.querySelectorAll('.tab-panel').forEach(function(p){ p.classList.remove('active'); });
  document.getElementById('tab-' + id).classList.add('active');
  document.querySelector('[data-tab="' + id + '"]').classList.add('active');
  // タブが表示された後に初期化（表示状態でないと高さが0になる）
  setTimeout(function() {
    initPanelCharts(document.getElementById('tab-' + id));
  }, 50);
}
// verdict フィルター
function applyFilter(btn, f) {
  var panel = btn.closest('.tab-panel');
  panel.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  panel.querySelectorAll('.card').forEach(function(card) {
    var v = (card.querySelector('.verdict') || {}).textContent || '';
    var show = f==='全て' ? true : f==='◎' ? v.startsWith('◎') : f==='○+' ? (v.startsWith('◎')||v.startsWith('○')) : (v.startsWith('△')||v.startsWith('✕'));
    card.classList.toggle('hidden', !show);
  });
}
// ウォッチリスト
function getWatchlist(){ try{ return new Set(JSON.parse(localStorage.getItem('watchlist')||'[]')); }catch(_){ return new Set(); } }
function toggleWatch(btn) {
  var name = decodeURIComponent(btn.dataset.name);
  var list = getWatchlist();
  if (list.has(name)) { list.delete(name); btn.textContent='☆'; btn.classList.remove('watching'); }
  else                { list.add(name);    btn.textContent='★'; btn.classList.add('watching'); }
  localStorage.setItem('watchlist', JSON.stringify([...list]));
}
function initWatchlist() {
  var watching = getWatchlist();
  document.querySelectorAll('.watch-btn').forEach(function(btn) {
    if (watching.has(decodeURIComponent(btn.dataset.name))) { btn.textContent='★'; btn.classList.add('watching'); }
  });
}
document.addEventListener('DOMContentLoaded', function() {
  var active = document.querySelector('.tab-panel.active');
  if (active) {
    setTimeout(function() { initPanelCharts(active); }, 100);
  }
  var btt = document.getElementById('btt');
  if (btt) {
    window.addEventListener('scroll', function() {
      btt.style.display = window.scrollY > 400 ? 'flex' : 'none';
    }, { passive: true });
  }
  initWatchlist();
});
</script>
</body>
